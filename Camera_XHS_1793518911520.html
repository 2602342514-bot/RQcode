<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片展示</title>
    <style>
        /* 这里是为了让图片在手机上显示得好看，不会超出屏幕 */
        body { padding: 15px; text-align: center; font-family: sans-serif; }
        img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- 下面这行是你要展示的文字，可以改 -->
    <p>这是我上传的第一张图片：</p>

    <!-- 下面这行是最关键的！把引号里的 pic1.jpg 换成你真实上传的图片名字 -->
    <img src="Camera_XHS_1793518911520.jpg" alt="图片加载失败">

</body>
</html>
